name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      macos_release: ${{ steps.classify.outputs.macos_release }}
      rust_comments: ${{ steps.classify.outputs.rust_comments }}
      metadata: ${{ steps.classify.outputs.metadata }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI change classifier
        shell: bash
        run: ./scripts/test-classify-ci-changes.sh

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            {
              echo "swift=true"
              echo "rust_core=true"
              echo "macos_release=true"
              echo "rust_comments=false"
              echo "metadata=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate changed text
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Set up Rust for comment verification
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust Core comment-only changes
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        shell: bash
        run: ./scripts/verify-rust-core-comments.sh

      - name: Validate lightweight metadata changes
        if: steps.classify.outputs.metadata == 'true'
        shell: bash
        run: |
          ruby -c Casks/lithe.rb
          ruby -c scripts/update-homebrew-cask.rb

      - name: Summarize selected lanes
        shell: bash
        env:
          SWIFT: ${{ steps.classify.outputs.swift }}
          RUST_CORE: ${{ steps.classify.outputs.rust_core }}
          MACOS_RELEASE: ${{ steps.classify.outputs.macos_release }}
          RUST_COMMENTS: ${{ steps.classify.outputs.rust_comments }}
          METADATA: ${{ steps.classify.outputs.metadata }}
        run: |
          {
            echo "### macOS CI lanes"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Swift tests | $SWIFT |"
            echo "| Rust Core tests | $RUST_CORE |"
            echo "| Release package verification | $MACOS_RELEASE |"
            echo "| Rust comment verification | $RUST_COMMENTS |"
            echo "| Metadata validation | $METADATA |"
          } >> "$GITHUB_STEP_SUMMARY"

  swift-tests:
    name: Swift tests
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Prepare verified SwiftPM cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"

      - name: Run Swift unit tests
        timeout-minutes: 12
        run: |
          ./scripts/test-macos.sh \
            --skip WebKitIntegrationTests \
            --skip '(LitheDatabaseModuleTests|LitheTests\.LitheCoreLogicTests/database)' \
            --skip '([Pp]lugin|LitheGoSupportModuleTests|LinuxDo)'

      - name: Run WebKit lifecycle integration tests
        timeout-minutes: 3
        run: |
          ./scripts/test-macos.sh \
            --skip-build \
            --filter WebKitIntegrationTests

  rust-core-tests:
    name: Rust Core and Swift bridge tests
    needs: changes
    if: needs.changes.outputs.rust_core == 'true'
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare verified dependency caches
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"

      - name: Run Rust Core tests and verify the Swift bridge
        run: ./scripts/verify-rust-core.sh

  release-build:
    name: Release package verification
    needs: changes
    if: needs.changes.outputs.macos_release == 'true'
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare verified dependency caches
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"

      - name: Check packaging scripts and metadata
        shell: zsh {0}
        run: |
          for script in scripts/*.sh; do
            if [[ "$(head -n 1 "$script")" == "#!/bin/zsh" ]]; then
              zsh -n "$script"
            fi
          done
          ruby -c scripts/update-homebrew-cask.rb
          ruby -c scripts/create-macos-update-manifest.rb
          ruby -c scripts/test-macos-update-manifest.rb
          ruby scripts/test-macos-update-manifest.rb
          plutil -lint Resources/Info.plist

      - name: Build and verify host architecture package
        run: ./scripts/verify-macos-package.sh

  ui-screenshot:
    name: UI screenshot verify (temp)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Prepare verified SwiftPM cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"

      - name: Build macOS app (debug)
        run: |
          chmod +x scripts/*.sh
          scripts/build-macos.sh --configuration debug
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) TRIPLE="arm64-apple-macosx" ;;
            x86_64) TRIPLE="x86_64-apple-macosx" ;;
          esac
          APP_DIR="ui-verify/Lithe.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources/OfficialPlugins" "$APP_DIR/Contents/Helpers"
          cp ".build/$TRIPLE/debug/Lithe" "$APP_DIR/Contents/MacOS/Lithe"
          cp Resources/Info.plist "$APP_DIR/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns" 2>/dev/null || true
          [ -d Resources/IDEAIcons ] && cp -R Resources/IDEAIcons "$APP_DIR/Contents/Resources/" || true
          [ -d Resources/DatabaseIcons ] && cp -R Resources/DatabaseIcons "$APP_DIR/Contents/Resources/" || true
          [ -d Resources/Fonts ] && cp -R Resources/Fonts "$APP_DIR/Contents/Resources/" || true
          for loc in en.lproj zh-Hans.lproj; do
            [ -d "Resources/$loc" ] && cp -R "Resources/$loc" "$APP_DIR/Contents/Resources/" || true
          done
          codesign --force --deep --sign - "$APP_DIR" || true
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Built bundle:"
          ls -la "$APP_DIR/Contents/MacOS/"

      - name: Write AppleScript helpers
        run: |
          cat > /tmp/lithe-windows.applescript <<'EOF'
          tell application "System Events"
            set procs to every process whose name contains "Lithe"
            repeat with p in procs
              try
                set winCount to count of windows of p
                log "Process " & (name of p) & " has " & winCount & " window(s)"
                repeat with i from 1 to winCount
                  set w to window i of p
                  try
                    log "  Window " & i & ": " & (name of w) & " | pos=" & (item 1 of position of w) & "," & (item 2 of position of w) & " | size=" & (item 1 of size of w) & "x" & (item 2 of size of w)
                  on error
                    log "  Window " & i & ": (no name/pos)"
                  end try
                end repeat
              end try
            end repeat
          end tell
          EOF
          chmod +x /tmp/lithe-windows.applescript

      - name: Create fixture project
        run: |
          set -euo pipefail
          FX="ci-fixture-project"
          mkdir -p "$FX"
          printf 'def hello():\n    print("Hello Lithe CI fixture")\n\nif __name__ == "__main__":\n    hello()\n' > "$FX/main.py"
          printf 'def add(a, b):\n    return a + b\n' > "$FX/utils.py"
          printf '# CI Fixture Project\n\nMinimal project for UI drag/dock validation.\n' > "$FX/README.md"
          printf '{\n  "name": "ci-fixture",\n  "version": "1.0"\n}\n' > "$FX/config.json"
          echo "FIXTURE_DIR=$(pwd)/$FX" >> "$GITHUB_ENV"
          ls -la "$FX"

      - name: Install cliclick
        run: |
          set -uo pipefail
          if command -v cliclick >/dev/null 2>&1; then
            echo "cliclick already installed: $(cliclick --version 2>&1 || true)"
          else
            echo "Installing cliclick via brew..."
            brew install cliclick || {
              echo "brew install failed, trying direct download..."
              curl -L -o /tmp/cliclick.zip https://github.com/bernhardkaindl/cliclick/releases/download/5.0/cliclick.zip || true
              if [ -f /tmp/cliclick.zip ]; then
                unzip -o /tmp/cliclick.zip -d /tmp/cliclick-bin >/dev/null 2>&1 || true
                cp /tmp/cliclick-bin/cliclick /usr/local/bin/ 2>/dev/null || sudo cp /tmp/cliclick-bin/cliclick /usr/local/bin/ 2>/dev/null || true
              fi
            }
            chmod +x /usr/local/bin/cliclick 2>/dev/null || true
          fi
          command -v cliclick >/dev/null 2>&1 && echo "cliclick ready: $(cliclick --version 2>&1 || true)" || echo "WARNING: cliclick not available"

      - name: Launch app with project + drag/dock tests
        run: |
          set -uo pipefail
          mkdir -p ui-shots
          FIXTURE="$(pwd)/ci-fixture-project"
          echo "Launching with --open-project $FIXTURE"
          open -n "$APP_DIR" --args --open-project "$FIXTURE"
          echo "Launched. Waiting for workbench to render..."
          sleep 35
          screencapture -x ui-shots/00-workbench-initial.png || echo "screencapture failed"
          LITHE_PID=$(pgrep -f "Lithe.app/Contents/MacOS/Lithe" | head -1 || true)
          echo "Lithe PID: ${LITHE_PID:-none}"
          osascript /tmp/lithe-windows.applescript > ui-shots/window-hierarchy.txt 2>&1 || true
          cat ui-shots/window-hierarchy.txt 2>/dev/null || true

          if ! command -v cliclick >/dev/null 2>&1; then
            echo "cliclick unavailable, skipping drag tests"
            pkill -f "Lithe.app/Contents/MacOS/Lithe" 2>/dev/null || true
            exit 0
          fi

          # Bring Lithe window to front
          osascript -e 'tell application "System Events" to set frontmost of (first process whose name contains "Lithe") to true' 2>/dev/null || true
          sleep 2

          # Window geometry (assume full-screen-ish on runner; adjust by probing)
          # Runner display is typically 1920x1080 or similar. Use relative coords.
          # Tab bar: top-center area. Left dock: left edge. Right dock: right edge. Bottom: bottom edge.
          # We probe actual window frame first.
          GEO=$(osascript -e 'tell application "System Events" to tell (first process whose name contains "Lithe") to get {position, size} of window 1' 2>/dev/null || echo "missing 0 0 1200 800")
          echo "Window geo: $GEO"
          # Parse: "x, y, w, h"
          WX=$(echo "$GEO" | awk -F', ' '{print $1}')
          WY=$(echo "$GEO" | awk -F', ' '{print $2}')
          WW=$(echo "$GEO" | awk -F', ' '{print $3}')
          WH=$(echo "$GEO" | awk -F', ' '{print $4}')
          [ -z "$WX" ] && WX=100
          [ -z "$WY" ] && WY=100
          [ -z "$WW" ] && WW=1200
          [ -z "$WH" ] && WH=800
          echo "Window: x=$WX y=$WY w=$WW h=$WH"

          # Key coordinates (relative to window origin)
          TAB_X=$((WX + WW/2))
          TAB_Y=$((WY + 45))        # tab bar row
          LEFT_X=$((WX + 180))      # left sidebar center
          LEFT_Y=$((WY + WH/2))
          RIGHT_X=$((WX + WW - 190)) # right sidebar center
          RIGHT_Y=$((WY + WH/2))
          BOTTOM_X=$((WX + WW/2))
          BOTTOM_Y=$((WY + WH - 60)) # bottom tool area
          echo "Tab: $TAB_X,$TAB_Y | Left: $LEFT_X,$LEFT_Y | Right: $RIGHT_X,$RIGHT_Y | Bottom: $BOTTOM_X,$BOTTOM_Y"

          # --- Drag 1: tab -> left sidebar (dock left) ---
          echo "=== Drag 1: tab to LEFT ==="
          cliclick "m:$TAB_X,$TAB_Y" "d:$TAB_X,$TAB_Y" "m:$LEFT_X,$LEFT_Y" "u:$LEFT_X,$LEFT_Y" 2>&1 || echo "drag1 failed"
          sleep 4
          screencapture -x ui-shots/01-dock-left.png || true

          # --- Drag 2: tab -> right sidebar (dock right) ---
          echo "=== Drag 2: tab to RIGHT ==="
          cliclick "m:$TAB_X,$TAB_Y" "d:$TAB_X,$TAB_Y" "m:$RIGHT_X,$RIGHT_Y" "u:$RIGHT_X,$RIGHT_Y" 2>&1 || echo "drag2 failed"
          sleep 4
          screencapture -x ui-shots/02-dock-right.png || true

          # --- Drag 3: tab -> bottom (dock bottom) ---
          echo "=== Drag 3: tab to BOTTOM ==="
          cliclick "m:$TAB_X,$TAB_Y" "d:$TAB_X,$TAB_Y" "m:$BOTTOM_X,$BOTTOM_Y" "u:$BOTTOM_X,$BOTTOM_Y" 2>&1 || echo "drag3 failed"
          sleep 4
          screencapture -x ui-shots/03-dock-bottom.png || true

          # --- Drag 4: tab swap (drag tab to another tab position) ---
          echo "=== Drag 4: tab SWAP ---"
          SWAP_X=$((TAB_X + 120))
          SWAP_Y=$TAB_Y
          cliclick "m:$TAB_X,$TAB_Y" "d:$TAB_X,$TAB_Y" "m:$SWAP_X,$SWAP_Y" "u:$SWAP_X,$SWAP_Y" 2>&1 || echo "drag4 failed"
          sleep 4
          screencapture -x ui-shots/04-tab-swap.png || true

          # Final settled shot
          sleep 5
          screencapture -x ui-shots/05-final.png || true

          echo "=== Screenshots ==="
          ls -la ui-shots/
          pkill -f "Lithe.app/Contents/MacOS/Lithe" 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/
          retention-days: 14

  gate:
    name: macOS CI gate
    needs:
      - changes
      - swift-tests
      - rust-core-tests
      - release-build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SWIFT_RESULT: ${{ needs.swift-tests.result }}
          RUST_CORE_RESULT: ${{ needs.rust-core-tests.result }}
          SWIFT_SELECTED: ${{ needs.changes.outputs.swift }}
          RUST_CORE_SELECTED: ${{ needs.changes.outputs.rust_core }}
          RELEASE_SELECTED: ${{ needs.changes.outputs.macos_release }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          require_selected_job() {
            local selected="$1"
            local result="$2"
            if [[ "$selected" == "true" ]]; then
              [[ "$result" == "success" ]]
            else
              [[ "$result" == "skipped" ]]
            fi
          }
          require_selected_job "$SWIFT_SELECTED" "$SWIFT_RESULT"
          require_selected_job "$RUST_CORE_SELECTED" "$RUST_CORE_RESULT"
          require_selected_job "$RELEASE_SELECTED" "$RELEASE_RESULT"
